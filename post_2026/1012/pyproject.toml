[project]
name = "1012"
version = "0.1.0"
description = "uv環境でSudachiPyのユーザ辞書を設定するデモ用"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.29.0",
    "python-dotenv>=1.2.4",
    "sudachidict-core>=20260723.1",
    "sudachipy>=0.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "alembic",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = ["E501", "C901", "UP015"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true


